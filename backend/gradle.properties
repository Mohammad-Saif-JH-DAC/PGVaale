# Gradle memory settings - Reduced for systems with limited memory
org.gradle.jvmargs=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel execution
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true
